apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-service
  namespace: flowforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-service
  template:
    metadata:
      labels:
        app: job-service
    spec:
      containers:
        - name: job-service
          image: flowforge-job-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/flowforge?options=-c%20TimeZone%3DUTC"

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            - name: SPRING_DATA_REDIS_HOST
              value: "redis"

            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

            - name: FLOWFORGE_RATE_LIMIT_MAX_REQUESTS
              value: "100"

            - name: FLOWFORGE_RATE_LIMIT_WINDOW_SECONDS
              value: "60"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 15


          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: job-service
  namespace: flowforge
spec:
  type: NodePort
  selector:
    app: job-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080